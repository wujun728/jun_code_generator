# =============== 数据库配置 ===================
generator.db.url=jdbc:mysql://localhost:3307/db_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
generator.db.driverName=com.mysql.cj.jdbc.Driver
generator.db.username=root
generator.db.password=mysqladmin

# =============== 生成目标 ===================
generator.tables=biz_test
generator.table.prefix=sys_

# =============== 输出路径 ===================
generator.output.dir=D:/output/java
generator.output.dir.xml=D:/output/resources/mapper

# =============== 包配置 ===================
generator.package.parent=com.example.modules
generator.package.moduleName=system

# =============== 模板组: curd(完整CRUD) / simple(父类继承) ===================
generator.template.group=curd

# =============== Swagger: true=v3/springdoc, false=v2/swagger2 ===================
generator.swagger.v3=true

# =============== 作者 ===================
generator.author=admin

# =============== 响应类(可选, curd模板Controller返回值包装) ===================
# 例如: com.example.common.Result
# 为空则直接返回实体类型
generator.response.class=

# =============== 父类配置(simple模板组 + generator.super.enabled=true时有效) ===================
generator.super.enabled=false
generator.super.controller=com.dcy.db.base.controller.BaseController
generator.super.entity=com.dcy.db.base.model.BaseModel
generator.super.service=com.dcy.db.base.service.BaseService
generator.super.serviceImpl=com.dcy.db.base.service.impl.BaseServiceImpl
generator.super.entityColumns=createBy,createDate,updateBy,updateDate,delFlag,remark

# =============== 可选扩展模板 ===================
generator.dto.enabled=false
generator.vue.enabled=false
generator.microservice.enabled=false