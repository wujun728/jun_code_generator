<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>芒果TV - 看见好时光</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 启动骨架屏 -->
<div id="start-loading" style="position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:750px;height:100vh;background:#1A1A1E;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;">
  <div style="font-size:36px;font-weight:700;color:#FF6B00;margin-bottom:16px;">芒果TV</div>
  <div style="width:40px;height:40px;border:3px solid #2A2A30;border-top-color:#FF6B00;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
</div>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- 应用主体 -->
<div class="app">
  <div class="pages-container"></div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>

</body>
</html>
